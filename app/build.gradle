plugins { id 'com.android.application' }

android {
    namespace 'com.nova.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nova.ai'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
